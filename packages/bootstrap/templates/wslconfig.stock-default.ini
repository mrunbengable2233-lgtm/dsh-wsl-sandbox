# Windows 宿主机原厂默认 %USERPROFILE%\.wslconfig 参考备份模板
# 路径（Windows 侧）: C:\Users\<你的用户名>\.wslconfig
# 注意：原厂全新安装的 Windows 默认不存在此文件（全部采用 Hyper-V 动态默认值）。
# 安装脚本 `install-dsh-plugin.ps1` 会在首次运行时自动将你原有的 `.wslconfig` 备份至：
#   %USERPROFILE%\.dsh\dsh-wsl-sandbox\backups\.wslconfig.orig

[wsl2]
# memory=8GB
# processors=4
# swap=2GB
# localhostForwarding=true
# networkingMode=nat
