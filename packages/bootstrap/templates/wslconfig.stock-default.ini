# Windows 宿主机原厂默认 %USERPROFILE%\.wslconfig 参考备份模板
# 路径（Windows 侧）: C:\Users\<你的用户名>\.wslconfig
# 注意：Windows 官方 WSL Settings 与第三方 WSL Manager 均读写此同一文件；本插件默认绝不自动改写它。
# 安装脚本 `install-dsh-plugin.ps1` 会在首次运行时自动将原有 `.wslconfig` 以只读快照（owner-only ACL + attrib +R）备份至：
#   %USERPROFILE%\.dsh\dsh-wsl-sandbox\backups\.wslconfig.orig（或用户自定义目录）

[wsl2]
# memory=8GB
# processors=4
# swap=2GB
# localhostForwarding=true
# networkingMode=nat
