# dsh-wsl-sandbox 发行版级严格加固 /etc/wsl.conf 模板（可选）
# 说明：
# 1. 默认情况下，dsh-wsl-sandbox 已在每次 bwrap 沙箱启动时通过 `--tmpfs /mnt`
#    在内核挂载命名空间层将 AI 可见的 `/mnt` 置为空内存盘（无需修改本文件即可阻止 AI 访问 C:\ / D:\ 全盘，
#    同时保留从主界面直接将 `D:\某文件夹` 单目录映射到 `/shares/<别名>` 的能力）。
# 2. 如果你希望连 WSL 发行版底层宿主命名空间也彻底禁止自动挂载 Windows C:\ / D:\ 盘符，
#    并彻底关闭 `.exe` 跨界互操作，可使用 `bash packages/bootstrap/provision-wsl.sh --disable-automount`
#    （会自动先备份原始 `/etc/wsl.conf` 到 `~/.config/dsh-wsl-sandbox/backups/wsl.conf.orig`）。
# 3. 还原方法：`bash packages/bootstrap/provision-wsl.sh --restore-configs` 后在 Windows 执行 `wsl.exe --shutdown`。

[boot]
systemd = true

[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false
