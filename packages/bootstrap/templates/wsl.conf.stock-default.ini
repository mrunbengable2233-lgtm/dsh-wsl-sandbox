# WSL 2 原厂默认 /etc/wsl.conf 参考备份模板（支持 Ubuntu 26.04/24.04、Debian、Fedora、Arch、Alpine 等）
# 路径（WSL 内）: /etc/wsl.conf（注意：与 Windows WSL Settings / WSL Manager 共享同一路径）
# 无 systemd 发行版（Alpine / Void / Devuan / Artix）请保持下面 systemd 行处于注释状态；本沙箱无需 systemd 即可运行。
# 修改或还原后需在 Windows PowerShell 仅重启当前发行版：`wsl.exe --terminate <当前发行版名称>`（切勿用 `--shutdown` 杀掉其他会话）。

# [boot]
# systemd = true

[automount]
enabled = true
root = /mnt/
mountFsTab = true

[interop]
enabled = true
appendWindowsPath = true
