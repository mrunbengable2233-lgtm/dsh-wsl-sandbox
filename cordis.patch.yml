# dsh-wsl-sandbox Cordis bundle patch
#
# Coexistence invariants (verified against official @deepseek-ai/dsh@0.2.2-rc.5 + Top 27 Marketplace plugins):
# - NEVER disables or overwrites DSH stock rows (`system-prompt`, `fs-local`, `subprocess-local`,
#   `sandbox-local`, `tool-pwsh`, `tool-bash`, or `preset-*`).
# - Single package-root entry (`name: 'dsh-wsl-sandbox'`) so both the Node Host half (`exports["."]`)
#   and Browser GUI half (`exports["./client"]` -> `client.js`) are discovered cleanly by `ClientModuleRegistry`.

- insert:
    - id: dsh-wsl-sandbox
      name: 'dsh-wsl-sandbox'
      config:
        enabled: true
        defaultDistro: 'Ubuntu-24.04'
        sandboxMode: 'workspace-write'
        approvalPolicyMode: 'balanced'
        approvalTimeoutMs: 60000
        networkMode: 'allowlist-proxy'
        upstreamProxy: ''
        cacheMode: 'workspace-persistent'
        injectSystemPromptSection: true
        enableHostPwshGuard: true
        advanced:
          shares: []
          deviceNodes: []
          localLabCidrs: []
          localLabPorts: []
          customAllowedDomains: []
